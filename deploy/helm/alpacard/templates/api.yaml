apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alpacard.fullname" . }}-api-config
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
data:
  PORT: "4000"
  DB_DRIVER: "postgres"
  DATABASE_URL: "postgres://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "alpacard.fullname" . }}-postgres-service:5432/{{ .Values.postgres.auth.database }}?sslmode=disable"
  RABBITMQ_URL: "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ include "alpacard.fullname" . }}-rabbitmq-service:5672/"
  APP_URL: {{ .Values.global.appUrl | quote }}
  WALLET_URL: {{ .Values.global.walletUrl | default "https://wallet.alpacard.app" | quote }}
  SMTP_FROM: "Alpacard <no-reply@alpacard.app>"
  CORS_ORIGINS: "https://alpacard.app,https://www.alpacard.app,https://wallet.alpacard.app,https://merchant.alpacard.app,https://demo.alpacard.app,http://localhost:5173,http://localhost:5174"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alpacard.fullname" . }}-api-secrets
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.api.jwtSecret | quote }}
---
{{- if .Values.api.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "alpacard.fullname" . }}-uploads-pvc
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.api.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alpacard.fullname" . }}-api
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
    app: {{ include "alpacard.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "alpacard.fullname" . }}-api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "4000"
      labels:
        app: {{ include "alpacard.fullname" . }}-api
    spec:
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command: ["/app/server"]
        ports:
        - containerPort: 4000
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "alpacard.fullname" . }}-api-config
        - secretRef:
            name: {{ include "alpacard.fullname" . }}-api-secrets
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: uploads-storage
        {{- if .Values.api.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "alpacard.fullname" . }}-uploads-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alpacard.fullname" . }}-worker
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
    app: {{ include "alpacard.fullname" . }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "alpacard.fullname" . }}-worker
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
      labels:
        app: {{ include "alpacard.fullname" . }}-worker
    spec:
      containers:
      - name: worker
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command: ["/app/worker"]
        ports:
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: {{ include "alpacard.fullname" . }}-api-config
        - secretRef:
            name: {{ include "alpacard.fullname" . }}-api-secrets
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alpacard.fullname" . }}-worker-service
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
    app: {{ include "alpacard.fullname" . }}-worker
spec:
  ports:
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: {{ include "alpacard.fullname" . }}-worker
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alpacard.fullname" . }}-api-service
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
spec:
  ports:
  - port: 4000
    targetPort: 4000
    name: http
  selector:
    app: {{ include "alpacard.fullname" . }}-api
