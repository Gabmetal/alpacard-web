{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "alpacard.fullname" . }}-ingress
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  {{- $fullName := include "alpacard.fullname" . }}
  {{- $domains := .Values.global.domains | default (list .Values.global.domain) }}
  {{- range $d := $domains }}
  - host: {{ $d }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-api-service
            port:
              number: 4000
      {{- if hasPrefix "wallet." $d }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-wallet-service
            port:
              number: 80
      {{- else }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-web-service
            port:
              number: 80
      {{- end }}
  {{- end }}
  tls:
  - hosts:
    {{- range $d := $domains }}
    - {{ $d }}
    {{- end }}
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
