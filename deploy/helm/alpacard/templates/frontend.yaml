apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alpacard.fullname" . }}-web
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
    app: {{ include "alpacard.fullname" . }}-web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "alpacard.fullname" . }}-web
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "80"
      labels:
        app: {{ include "alpacard.fullname" . }}-web
    spec:
      containers:
      - name: web
        image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.web.image.pullPolicy }}
        ports:
        - containerPort: 80
          name: http
        resources:
          {{- toYaml .Values.web.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alpacard.fullname" . }}-web-service
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: {{ include "alpacard.fullname" . }}-web
---
