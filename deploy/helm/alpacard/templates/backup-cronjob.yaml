{{- if and .Values.backup (default false .Values.backup.enabled) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "alpacard.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alpacard.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | default "0 3 * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "alpacard.name" . }}-backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
            command:
            - /bin/sh
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              echo "[$(date)] Starting Alpacard database backup..."
              PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump -h {{ include "alpacard.fullname" . }}-postgres-service -U {{ .Values.postgres.user }} {{ .Values.postgres.db }} > /backup/alpacard_${TIMESTAMP}.sql
              echo "[$(date)] Backup completed: /backup/alpacard_${TIMESTAMP}.sql ($(wc -c < /backup/alpacard_${TIMESTAMP}.sql) bytes)"
              # Retain latest 14 files
              ls -t /backup/alpacard_*.sql 2>/dev/null | tail -n +15 | xargs -r rm -f
              echo "[$(date)] Rotation complete."
            env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "alpacard.fullname" . }}-secrets
                  key: postgres-password
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: {{ .Values.backup.pvcName | default (printf "%s-uploads-pvc" (include "alpacard.fullname" .)) }}
{{- end }}
