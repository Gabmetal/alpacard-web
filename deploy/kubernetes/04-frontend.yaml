apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpacard-web
  namespace: alpacard
  labels:
    app: alpacard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpacard-web
  template:
    metadata:
      labels:
        app: alpacard-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: web
        image: localhost/alpacard-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: alpacard-web-service
  namespace: alpacard
  labels:
    app: alpacard-web
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: alpacard-web
---
