apiVersion: v1
kind: ConfigMap
metadata:
  name: alpacard-api-config
  namespace: alpacard
data:
  PORT: "4000"
  DB_DRIVER: "postgres"
  DATABASE_URL: "postgres://alpacard:alpacard_pg_prod_secret_2026@alpacard-postgres-service:5432/alpacard?sslmode=disable"
  RABBITMQ_URL: "amqp://guest:guest@alpacard-rabbitmq-service:5672/"
  APP_URL: "https://alpacard.app"
  CORS_ORIGINS: "https://alpacard.app,https://www.alpacard.app,https://alpacard.gabo.lat,http://localhost:5173,http://localhost:5174"
---
apiVersion: v1
kind: Secret
metadata:
  name: alpacard-api-secrets
  namespace: alpacard
type: Opaque
stringData:
  JWT_SECRET: "alpacard_super_secret_jwt_key_cloud_prod_2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpacard-api
  namespace: alpacard
  labels:
    app: alpacard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpacard-api
  template:
    metadata:
      labels:
        app: alpacard-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: localhost/alpacard-api:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/server"]
        ports:
        - containerPort: 4000
          name: http
        envFrom:
        - configMapRef:
            name: alpacard-api-config
        - secretRef:
            name: alpacard-api-secrets
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpacard-worker
  namespace: alpacard
  labels:
    app: alpacard-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpacard-worker
  template:
    metadata:
      labels:
        app: alpacard-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: worker
        image: localhost/alpacard-api:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/worker"]
        ports:
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: alpacard-api-config
        - secretRef:
            name: alpacard-api-secrets
        resources:
          requests:
            cpu: "10m"
            memory: "20Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: alpacard-api-service
  namespace: alpacard
  labels:
    app: alpacard-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: "/metrics"
spec:
  ports:
  - port: 4000
    targetPort: 4000
    name: http
  selector:
    app: alpacard-api
---
apiVersion: v1
kind: Service
metadata:
  name: alpacard-worker-service
  namespace: alpacard
  labels:
    app: alpacard-worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  ports:
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: alpacard-worker
