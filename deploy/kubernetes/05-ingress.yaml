apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alpacard-ingress
  namespace: alpacard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  labels:
    app.kubernetes.io/name: alpacard
spec:
  ingressClassName: traefik
  rules:
  - host: alpacard.app
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alpacard-api-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpacard-web-service
            port:
              number: 80
  - host: www.alpacard.app
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alpacard-api-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpacard-web-service
            port:
              number: 80
  - host: alpacard.gabo.lat
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alpacard-api-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpacard-web-service
            port:
              number: 80
  - host: wallet.alpacard.app
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alpacard-api-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpacard-wallet-service
            port:
              number: 80
  - host: merchant.alpacard.app
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alpacard-api-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpacard-web-service
            port:
              number: 80
  - host: demo.alpacard.app
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alpacard-api-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpacard-web-service
            port:
              number: 80
  tls:
  - hosts:
    - alpacard.app
    - www.alpacard.app
    - alpacard.gabo.lat
    - wallet.alpacard.app
    - merchant.alpacard.app
    - demo.alpacard.app
    secretName: alpacard-tls
