name: CD - Deploy to Dev Environment

on:
  push:
    branches:
      - dev

jobs:
  deploy-to-dev:
    name: Build & Deploy to Dev (alpacard-dev)
    runs-on: [self-hosted, alpacard-k8s]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Automated Dev Deployment
        run: |
          chmod +x ./scripts/deploy-env.sh
          ./scripts/deploy-env.sh dev

      - name: Setup Node.js for Post-Deploy Smoke Suite
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright & Browsers
        run: |
          cd tests/playwright
          npm install
          npx playwright install --with-deps chromium

      - name: Post-Deployment Smoke Verification (@smoke)
        id: smoke-test
        env:
          BASE_URL: https://dev.alpacard.app
          CI: true
        run: |
          cd tests/playwright
          npm run test:smoke

      - name: Dev Deployment Health Summary (Success)
        if: success()
        run: |
          echo "### 🚀 Dev Deployment & Smoke Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`alpacard-dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: [https://dev.alpacard.app](https://dev.alpacard.app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Status**: ✅ Verified Active & Passing" >> $GITHUB_STEP_SUMMARY

      - name: Dev Deployment Health Summary (Failure)
        if: failure()
        run: |
          echo "### ❌ Dev Deployment & Smoke Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`alpacard-dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: [https://dev.alpacard.app](https://dev.alpacard.app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Status**: ❌ Smoke Verification Failed" >> $GITHUB_STEP_SUMMARY
