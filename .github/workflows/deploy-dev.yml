name: CD - Deploy to Dev Environment

on:
  push:
    branches:
      - dev

jobs:
  deploy-to-dev:
    name: Build & Deploy to Dev (alpacard-dev)
    runs-on: [self-hosted, alpacard-k8s]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Automated Dev Deployment
        run: |
          chmod +x ./scripts/deploy-env.sh
          ./scripts/deploy-env.sh dev

      - name: Dev Deployment Health Summary
        if: always()
        run: |
          echo "### 🚀 Dev Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`alpacard-dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: [https://dev.alpacard.app](https://dev.alpacard.app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Active on Kubernetes" >> $GITHUB_STEP_SUMMARY
