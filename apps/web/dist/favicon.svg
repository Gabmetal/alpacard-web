<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="alpacaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3525"/>
      <stop offset="100%" stop-color="#261A12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#alpacaGrad)"/>
  
  <!-- Subtle Border -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Stylized Alpaca Silhouette -->
  <!-- Ears -->
  <path d="M 46 22 C 43 22 41 26 43 36 L 46 44 L 51 44 L 51 32 C 51 25 49 22 46 22 Z" fill="#FDFBF7"/>
  <path d="M 58 22 C 55 22 53 26 55 36 L 57 44 L 62 44 L 62 32 C 62 25 60 22 58 22 Z" fill="#FDFBF7"/>

  <!-- Head & Long Neck -->
  <path d="M 44 42 C 44 38 48 34 54 34 C 60 34 66 37 66 42 L 66 48 L 78 48 C 84 48 88 52 88 58 C 88 65 83 69 76 69 L 66 69 L 66 88 C 66 94 62 98 56 98 L 44 98 C 40 98 38 94 38 88 L 38 48 C 38 44 40 42 44 42 Z" fill="#FDFBF7" filter="url(#shadow)"/>

  <!-- Snout / Nose -->
  <circle cx="80" cy="56" r="3" fill="#3D2B1F"/>
  <ellipse cx="56" cy="46" r="3" fill="#3D2B1F"/>

  <!-- Fluffy Chest Cloud tuft -->
  <path d="M 38 72 C 34 72 31 75 31 79 C 31 83 34 86 38 86 Z" fill="#FDFBF7"/>
  
  <!-- Golden Loyalty Stamp Sparkle Star badge in bottom right -->
  <g transform="translate(74, 74)">
    <circle cx="20" cy="20" r="18" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <path d="M 20 8 L 23.5 16.5 L 32 20 L 23.5 23.5 L 20 32 L 16.5 23.5 L 8 20 L 16.5 16.5 Z" fill="#FFFFFF"/>
  </g>
</svg>
