server {
    listen 80;
    server_name localhost;

    # Prometheus metrics endpoint
    location = /metrics {
        default_type text/plain;
        access_log off;
        return 200 "# HELP alpacard_wallet_up Whether Alpacard Wallet is up\n# TYPE alpacard_wallet_up gauge\nalpacard_wallet_up 1\n# HELP alpacard_wallet_connections_active Active connections on wallet frontend\n# TYPE alpacard_wallet_connections_active gauge\nalpacard_wallet_connections_active $connections_active\n# HELP alpacard_wallet_connections_reading Connections reading\n# TYPE alpacard_wallet_connections_reading gauge\nalpacard_wallet_connections_reading $connections_reading\n# HELP alpacard_wallet_connections_writing Connections writing\n# TYPE alpacard_wallet_connections_writing gauge\nalpacard_wallet_connections_writing $connections_writing\n# HELP alpacard_wallet_connections_waiting Connections waiting\n# TYPE alpacard_wallet_connections_waiting gauge\nalpacard_wallet_connections_waiting $connections_waiting\n";
    }

    # Healthcheck
    location = /health {
        default_type application/json;
        access_log off;
        return 200 '{"status":"healthy","service":"alpacard-wallet"}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
